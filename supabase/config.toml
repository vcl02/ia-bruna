# Configuração das Edge Functions deste projeto.
# O webhook da Meta não manda JWT do Supabase: a autenticação dele é a
# assinatura X-Hub-Signature-256, validada no código.
[functions.salao-webhook]
verify_jwt = false

# A tela chama com o JWT do usuário logado; a função ainda confere salao_equipe.
[functions.salao-responder]
verify_jwt = true
